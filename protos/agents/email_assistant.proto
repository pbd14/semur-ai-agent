message EmailAssistantMentionedEmail {
    // TODO: This has limited options
    string id = 1;
    string nangoIntegrationId = 2;
    string provider = 3;
    string subject = 4;
    string senderName = 5;
    string senderEmail = 6;
    string snippet = 7;
    string date = 8;
    float importanceScore = 9;
}

message EmailAssistantSuggestedReply {
    string replyText = 1;
    string replySubject = 2;
}

