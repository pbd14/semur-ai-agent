message EmailAssistantChatOutput {
    string replyText = 1;
    EmailAssistantChatArtifacts artifacts = 2;
    EmailAssistantChatMetadata metadata = 3;
}

message EmailAssistantChatArtifacts {
    repeated EmailAssistantMentionedEmail mentionedEmails = 1;
}

message EmailAssistantChatMetadata {
    int32 totalEmailsAnalyzed = 1;
    string timeRange = 2;
}

message EmailAssistantGenerateResponseEmailInput {
    string from = 1;
    string to = 2;
    string date = 3;
    string subject = 4;
    string body = 5;
}

message EmailAssistantGenerateResponseEmailOutput {
    string responseEmailSubject = 1;
    string responseEmailBody = 2;
}
