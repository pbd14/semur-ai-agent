name: semur
description: "Semur AI platform"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  provider: ^6.1.2
  url_launcher: ^6.3.0
  date_format: ^2.0.7
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  overlay_support: ^2.1.0
  logger: ^2.5.0
  webview_flutter: ^4.8.0
  carousel_slider: ^5.0.0
  # flutter_local_notifications: ^17.2.1+2
  restart_app: ^1.2.1
  image_picker: ^1.1.2
  csc_picker_plus: ^0.0.3
  markdown_widget: ^2.3.2+8

  multi_dropdown: ^3.0.1
  share_plus: ^10.1.4
  flutter_native_splash: ^2.4.1
  rive: ^0.13.9
  encrypt: ^5.0.3
  equatable: ^2.0.5
  bloc: ^9.0.0
  flutter_bloc: ^9.0.0
  shared_preferences: ^2.2.3
  auto_route: ^9.3.0+1
  uuid: ^4.4.2
  firebase_core: ^3.2.0
  firebase_core_web: ^2.17.3
  firebase_auth: ^5.1.2
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.1.0
  firebase_remote_config: ^5.0.3
  firebase_storage: ^12.1.1
  cloud_functions: ^5.0.3
  firebase_messaging: ^15.0.3
  firebase_dynamic_links: ^6.0.3
  firebase_crashlytics: ^4.0.3
  firebase_analytics: ^11.3.0
  firebase_performance: ^0.10.0+3
  firebase_app_check: ^0.3.0+2
  geoflutterfire_plus: ^0.0.32
  timezone: ^0.10.0
  vibration: ^3.1.3

  # HTTP
  dio: ^5.5.0+1
  app_links: ^6.3.3
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  html: ^0.15.4

  protobuf: ^3.1.0
  permission_handler: ^11.3.1
  photo_view: ^0.15.0

  # Upgrader
  upgrader: ^11.3.1

  # Package info
  package_info_plus: ^8.0.0
  version: ^3.0.2

  syncfusion_flutter_datepicker: ^28.2.5
  flex_color_picker: ^3.3.1

  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: null
  auto_route_generator: ^9.3.1
  build_runner: ^2.4.11
  flutter_lints: ^5.0.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Default
      fonts:
        - asset: assets/fonts/Kanit-Regular.ttf
        - asset: assets/fonts/Kanit-ExtraLight.ttf
          style: italic
        - asset: assets/fonts/Kanit-SemiBold.ttf
          weight: 700
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/vendors/
